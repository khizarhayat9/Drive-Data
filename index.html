                        </div>
                    </aside>
                </div>
            );
        }

        // ========================================================================
        // 3. TRIP HISTORY & EXCEL EXPORT VIEW
        // ========================================================================
        function TripHistoryView({ trips, expenses, currencySymbol, user, userEmail, onEditTrip }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [typeFilter, setTypeFilter] = useState('All');
            const [dateFilter, setDateFilter] = useState('');
            const [sortBy, setSortBy] = useState('date-desc');

            const filtered = useMemo(() => {
                return trips
                    .filter((t) => {
                        if (typeFilter !== 'All' && t.tripType !== typeFilter) return false;
                        if (dateFilter && t.date !== dateFilter) return false;
                        if (searchQuery.trim()) {
                            const q = searchQuery.toLowerCase();
                            const match =
                                (t.title || '').toLowerCase().includes(q) ||
                                (t.client || '').toLowerCase().includes(q) ||
                                (t.vehicle || '').toLowerCase().includes(q) ||
                                (t.destination || '').toLowerCase().includes(q);
                            if (!match) return false;
                        }
                        return true;
                    })
                    .sort((a, b) => {
                        if (sortBy === 'date-desc') return (b.date || '').localeCompare(a.date || '');
                        if (sortBy === 'income-desc') return (Number(b.price) || 0) - (Number(a.price) || 0);
                        if (sortBy === 'profit-desc') return (Number(b.netProfit) || 0) - (Number(a.netProfit) || 0);
                        if (sortBy === 'expense-desc') return (Number(b.totalExpenses) || 0) - (Number(a.totalExpenses) || 0);
                        return 0;
                    });
            }, [trips, typeFilter, dateFilter, searchQuery, sortBy]);

            const handleDelete = async (tripId) => {
                if (!window.confirm('Delete this trip record permanently?')) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'trips', tripId));
                } catch (err) {
                    alert('Delete failed: ' + err.message);
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl flex flex-wrap items-center justify-between gap-3 border-b-4 border-[#E5A93C]">
                        <div>
                            <h2 className="text-lg font-black">Trip History & Search</h2>
                            <p className="text-xs text-[#FAD8C8]">{filtered.length} matching records in your cloud database</p>
                        </div>
                        <button
                            type="button"
                            onClick={() => exportToExcelWorkbook({ trips: filtered, expenses, currencySymbol, periodLabel: 'Filtered_History', userEmail })}
                            className="px-4 py-2 rounded-xl bg-[#5E8C31] hover:bg-[#4D7526] text-white text-xs font-extrabold flex items-center gap-2 shadow"
                        >
                            <FileSpreadsheet className="w-4 h-4" />
                            Download Excel (.xls)
                        </button>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-[#E2B8A6] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        <div className="relative">
                            <Search className="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" />
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Search client, title, vehicle..."
                                className="w-full pl-9 pr-3 py-2 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900"
                            />
                        </div>
                        <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900">
                            <option value="All">All Trip Types</option>
                            {TRIP_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <input type="date" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="px-3 py-2 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900">
                            <option value="date-desc">Sort: Latest Date</option>
                            <option value="profit-desc">Sort: Highest Profit</option>
                            <option value="income-desc">Sort: Highest Income</option>
                            <option value="expense-desc">Sort: Highest Expenses</option>
                        </select>
                    </div>

                    {filtered.length === 0 ? (
                        <div className="bg-white rounded-2xl p-10 text-center border border-[#E2B8A6]">
                            <p className="text-sm font-bold text-[#4E1609]">No trip records found.</p>
                            <p className="text-xs text-gray-500 mt-1">Record your first trip or clear your search filters.</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {filtered.map((trip) => (
                                <div key={trip.id} className="bg-white rounded-2xl p-4 shadow-sm border border-[#E2B8A6] flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="space-y-1">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <span className="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-[#4E1609] text-[#F5B942]">{trip.tripType}</span>
                                            <span className="text-xs font-bold text-gray-500">{trip.date}</span>
                                            {trip.vehicle && <span className="text-xs font-semibold text-[#8B2610] bg-[#FFF3ED] px-2 py-0.5 rounded-md">{trip.vehicle}</span>}
                                        </div>
                                        <h3 className="text-base font-black text-[#2B120B]">{trip.title}</h3>
                                        <p className="text-xs text-gray-600">
                                            Client: <strong>{trip.client || 'N/A'}</strong>
                                            {(trip.startLocation || trip.destination) && <> • Route: {trip.startLocation || 'Start'} → {trip.destination || 'End'}</>}
                                        </p>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-4 justify-between md:justify-end border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                                        <div className="text-right">
                                            <div className="text-[10px] uppercase font-bold text-gray-400">Income</div>
                                            <div className="text-sm font-extrabold text-gray-900">{formatMoney(trip.price, currencySymbol)}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] uppercase font-bold text-gray-400">Expenses</div>
                                            <div className="text-sm font-extrabold text-[#8B2610]">{formatMoney(trip.totalExpenses, currencySymbol)}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] uppercase font-bold text-gray-400">Net Profit</div>
                                            <div className={`text-sm font-black ${(Number(trip.netProfit) || 0) >= 0 ? 'text-[#4E8B31]' : 'text-red-600'}`}>
                                                {formatMoney(trip.netProfit, currencySymbol)}
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-1.5">
                                            <button type="button" onClick={() => onEditTrip(trip)} className="p-2 rounded-xl bg-[#FFF3ED] hover:bg-[#FAD8C8] text-[#4E1609]" title="Edit Trip">
                                                <Edit3 className="w-4 h-4" />
                                            </button>
                                            <button type="button" onClick={() => handleDelete(trip.id)} className="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-700" title="Delete Trip">
                                                <Trash2 className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ========================================================================
        // 4. STANDALONE EXPENSES VIEW
        // ========================================================================
        function ExpensesView({ expenses, currencySymbol, user, defaultVehicle }) {
            const todayStr = new Date().toISOString().slice(0, 10);
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('Vehicle Maintenance');
            const [amount, setAmount] = useState('');
            const [date, setDate] = useState(todayStr);
            const [vehicle, setVehicle] = useState(defaultVehicle || '');
            const [notes, setNotes] = useState('');
            const [saving, setSaving] = useState(false);

            const handleAddExpense = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'expenses'), {
                        title: title.trim() || category,
                        category,
                        amount: parseFloat(amount) || 0,
                        date,
                        vehicle: vehicle.trim() || 'Primary Vehicle',
                        notes: notes.trim(),
                        createdAt: serverTimestamp()
                    });
                    setTitle('');
                    setAmount('');
                    setNotes('');
                } catch (err) {
                    alert('Error adding expense: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleDelete = async (id) => {
                if (!window.confirm('Delete this expense record?')) return;
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'expenses', id));
            };

            return (
                <div className="max-w-4xl mx-auto space-y-5">
                    <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl border-b-4 border-[#E5A93C]">
                        <h2 className="text-lg font-black">Standalone Expense Manager</h2>
                        <p className="text-xs text-[#FAD8C8]">Record maintenance, oil changes, parking, or tolls not tied to a single trip.</p>
                    </div>

                    <form onSubmit={handleAddExpense} className="bg-white p-5 rounded-2xl shadow-sm border border-[#E2B8A6] space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Category *</label>
                                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900">
                                    {EXPENSE_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Amount ({currencySymbol}) *</label>
                                <input type="number" step="any" min="0" required value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base font-bold text-gray-900" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Date *</label>
                                <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Description *</label>
                                <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Synthetic Engine Oil & Filter" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Vehicle</label>
                                <input type="text" value={vehicle} onChange={(e) => setVehicle(e.target.value)} placeholder="Vehicle name / plate" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                            </div>
                        </div>

                        <button type="submit" disabled={saving} className="px-6 py-3 rounded-xl bg-[#4E1609] hover:bg-[#6B1D0E] text-white font-bold text-sm shadow">
                            {saving ? 'Saving...' : '+ Add Expense'}
                        </button>
                    </form>

                    <div className="space-y-2.5">
                        {expenses.map((exp) => (
                            <div key={exp.id} className="bg-white p-4 rounded-2xl border border-[#E2B8A6] flex items-center justify-between">
                                <div>
                                    <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-[#FFF3ED] text-[#4E1609]">{exp.category}</span>
                                    <span className="text-xs text-gray-500 ml-2">{exp.date}</span>
                                    <h4 className="text-sm font-bold text-gray-900 mt-1">{exp.title}</h4>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="text-sm font-black text-[#8B2610]">{formatMoney(exp.amount, currencySymbol)}</span>
                                    <button type="button" onClick={() => handleDelete(exp.id)} className="p-2 rounded-xl bg-red-50 text-red-700 hover:bg-red-100">
                                        <Trash2 className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ========================================================================
        // 5. SETTINGS & EXCEL EXPORT VIEW
        // ========================================================================
        function SettingsView({ user, preferences, onSavePreferences, trips, expenses }) {
            const [currencyCode, setCurrencyCode] = useState(preferences.currencyCode || 'PKR');
            const [defaultVehicle, setDefaultVehicle] = useState(preferences.defaultVehicle || '');
            const [businessName, setBusinessName] = useState(preferences.businessName || '');
            const [savedMsg, setSavedMsg] = useState('');

            useEffect(() => {
                setCurrencyCode(preferences.currencyCode || 'PKR');
                setDefaultVehicle(preferences.defaultVehicle || '');
                setBusinessName(preferences.businessName || '');
            }, [preferences]);

            const selectedCurr = CURRENCIES.find((c) => c.code === currencyCode) || CURRENCIES[0];

            const handleSave = async (e) => {
                e.preventDefault();
                await onSavePreferences({
                    currencyCode: selectedCurr.code,
                    currencySymbol: selectedCurr.symbol,
                    defaultVehicle: defaultVehicle.trim(),
                    businessName: businessName.trim()
                });
                setSavedMsg('Settings saved to your cloud profile!');
                setTimeout(() => setSavedMsg(''), 3000);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-5">
                    <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl border-b-4 border-[#E5A93C]">
                        <h2 className="text-lg font-black">Workspace & Country Currency Settings</h2>
                        <p className="text-xs text-[#FAD8C8]">Customize your currency, default vehicle, and download full Excel backups</p>
                    </div>

                    {savedMsg && (
                        <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs font-bold flex items-center gap-2">
                            <CheckCircle2 className="w-4 h-4 text-emerald-600" /> {savedMsg}
                        </div>
                    )}

                    <form onSubmit={handleSave} className="bg-white p-6 rounded-2xl shadow-sm border border-[#E2B8A6] space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1.5 flex items-center gap-1.5">
                                <Globe className="w-4 h-4" /> Select Your Country Currency
                            </label>
                            <select value={currencyCode} onChange={(e) => setCurrencyCode(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base font-bold text-gray-900">
                                {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.name} — Symbol: {c.symbol}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1.5">Default Vehicle Name / Plate Number</label>
                            <input type="text" value={defaultVehicle} onChange={(e) => setDefaultVehicle(e.target.value)} placeholder="e.g. Honda Civic (ISB-452)" className="w-full px-4 py-3 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-[#4E1609] uppercase mb-1.5">Fleet / Company Header Name (Optional)</label>
                            <input type="text" value={businessName} onChange={(e) => setBusinessName(e.target.value)} placeholder="e.g. Hayat Executive Transport" className="w-full px-4 py-3 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6] text-base text-gray-900" />
                        </div>

                        <button type="submit" className="px-6 py-3 rounded-xl bg-[#4E1609] hover:bg-[#6B1D0E] text-white font-bold text-sm shadow">
                            Save Preferences
                        </button>
                    </form>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#E2B8A6] space-y-3">
                        <h3 className="text-sm font-black text-[#4E1609] uppercase">Download Cloud Data to Microsoft Excel (.xls)</h3>
                        <p className="text-xs text-gray-600">
                            Your data is stored privately in your cloud account (<strong>{user.email}</strong>). Export a formatted 3-sheet Excel workbook anytime:
                        </p>
                        <button
                            type="button"
                            onClick={() => exportToExcelWorkbook({ trips, expenses, currencySymbol: selectedCurr.symbol, periodLabel: 'Complete_All_Time', userEmail: user.email })}
                            className="px-4 py-2.5 rounded-xl bg-[#5E8C31] hover:bg-[#4D7526] text-white text-xs font-extrabold flex items-center gap-2 shadow"
                        >
                            <FileSpreadsheet className="w-4 h-4" />
                            Export All-Time Excel Workbook
                        </button>
                    </div>
                </div>
            );
        }

        // ========================================================================
        // MAIN ROOT APPLICATION
        // ========================================================================
        function App() {
            const [user, setUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [activeTab, setActiveTab] = useState('record');
            const [trips, setTrips] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [editingTrip, setEditingTrip] = useState(null);
            const [toast, setToast] = useState('');
            const [preferences, setPreferences] = useState({
                currencyCode: 'PKR',
                currencySymbol: 'Rs.',
                defaultVehicle: '',
                businessName: ''
            });

            useEffect(() => {
                const manifest = {
                    name: 'DRIVE DATA — Transport Management',
                    short_name: 'DRIVE DATA',
                    start_url: '.',
                    display: 'standalone',
                    background_color: '#FAD8C8',
                    theme_color: '#4E1609'
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const manifestUrl = URL.createObjectURL(blob);
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = manifestUrl;
                document.head.appendChild(link);
                return () => {
                    document.head.removeChild(link);
                    URL.revokeObjectURL(manifestUrl);
                };
            }, []);

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setAuthReady(true);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) {
                    setTrips([]);
                    setExpenses([]);
                    return;
                }
                const unsubTrips = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'trips'), (snap) => {
                    const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                    setTrips(list);
                });
                const unsubExp = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'expenses'), (snap) => {
                    const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                    setExpenses(list);
                });
                const unsubPref = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'preferences'), (snap) => {
                    if (snap.exists()) setPreferences((prev) => ({ ...prev, ...snap.data() }));
                });
                return () => { unsubTrips(); unsubExp(); unsubPref(); };
            }, [user]);

            const handleSavePreferences = async (newPrefs) => {
                if (!user) return;
                setPreferences((prev) => ({ ...prev, ...newPrefs }));
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'preferences'), newPrefs, { merge: true });
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3200);
            };

            if (!authReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#FAD8C8]">
                        <div className="flex flex-col items-center gap-3">
                            <CarLogo3D size="lg" />
                            <p className="text-sm font-black text-[#4E1609] tracking-wider">LOADING DRIVE DATA...</p>
                        </div>
                    </div>
                );
            }

            if (!user) return <AuthScreen />;

            const navItems = [
                { id: 'record', label: 'Record Trip', icon: PlusCircle },
                { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
                { id: 'history', label: 'Trip History', icon: History },
                { id: 'expenses', label: 'Expenses', icon: Receipt },
                { id: 'settings', label: 'Settings', icon: Settings }
            ];

            return (
                <div className="min-h-screen pb-24 md:pb-8 bg-[#FAD8C8]">
                    <header className="bg-[#4E1609] text-white sticky top-0 z-30 shadow-lg border-b-2 border-[#E5A93C] no-print">
                        <div className="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <CarLogo3D size="sm" />
                                <div>
                                    <span className="text-base md:text-lg font-black tracking-wider text-[#FFF6E5] block leading-none">
                                        {preferences.businessName || 'DRIVE DATA'}
                                    </span>
                                    <span className="text-[10px] text-[#F5B942] font-semibold">
                                        {user.displayName || user.email}
                                    </span>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-1.5">
                                {navItems.map((item) => {
                                    const Icon = item.icon;
                                    const active = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            type="button"
                                            onClick={() => { if (item.id !== 'record') setEditingTrip(null); setActiveTab(item.id); }}
                                            className={`px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-2 transition ${active ? 'bg-[#FAD8C8] text-[#4E1609] shadow' : 'text-[#FAD8C8] hover:bg-[#6B1D0E] hover:text-white'}`}
                                        >
                                            <Icon className="w-4 h-4" />
                                            {item.label}
                                        </button>
                                    );
                                })}
                            </nav>

                            <button
                                type="button"
                                onClick={() => signOut(auth)}
                                className="px-3 py-2 rounded-xl bg-[#6B1D0E] hover:bg-red-800 text-[#FAD8C8] hover:text-white text-xs font-bold flex items-center gap-1.5 transition"
                            >
                                <LogOut className="w-4 h-4" />
                                <span className="hidden sm:inline">Logout</span>
                            </button>
                        </div>
                    </header>

                    {toast && (
                        <div className="fixed top-16 right-4 z-50 bg-[#4E8B31] text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-extrabold flex items-center gap-2">
                            <CheckCircle2 className="w-4 h-4" /> {toast}
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-3 sm:px-5 pt-5">
                        {activeTab === 'record' && (
                            <RecordTripView
                                user={user}
                                currencySymbol={preferences.currencySymbol}
                                defaultVehicle={preferences.defaultVehicle}
                                editingTrip={editingTrip}
                                onCancelEdit={() => setEditingTrip(null)}
                                onSaved={(msg) => { setEditingTrip(null); showToast(msg); }}
                            />
                        )}
                        {activeTab === 'dashboard' && (
                            <DashboardView trips={trips} expenses={expenses} currencySymbol={preferences.currencySymbol} userEmail={user.email} />
                        )}
                        {activeTab === 'history' && (
                            <TripHistoryView
                                trips={trips}
                                expenses={expenses}
                                currencySymbol={preferences.currencySymbol}
                                user={user}
                                userEmail={user.email}
                                onEditTrip={(trip) => { setEditingTrip(trip); setActiveTab('record'); }}
                            />
                        )}
                        {activeTab === 'expenses' && (
                            <ExpensesView expenses={expenses} currencySymbol={preferences.currencySymbol} user={user} defaultVehicle={preferences.defaultVehicle} />
                        )}
                        {activeTab === 'settings' && (
                            <SettingsView user={user} preferences={preferences} onSavePreferences={handleSavePreferences} trips={trips} expenses={expenses} />
                        )}
                    </main>

                    <nav className="md:hidden fixed bottom-0 inset-x-0 bg-[#4E1609] border-t-2 border-[#E5A93C] z-30 flex justify-around py-1.5 px-1 no-print">
                        {navItems.map((item) => {
                            const Icon = item.icon;
                            const active = activeTab === item.id;
                            return (
                                <button
                                    key={item.id}
                                    type="button"
                                    onClick={() => { if (item.id !== 'record') setEditingTrip(null); setActiveTab(item.id); }}
                                    className={`flex flex-col items-center py-1 px-2 rounded-xl text-[10px] font-extrabold transition ${active ? 'bg-[#FAD8C8] text-[#4E1609]' : 'text-[#FAD8C8]'}`}
                                >
                                    <Icon className="w-4 h-4 mb-0.5" />
                                    {item.label}
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
