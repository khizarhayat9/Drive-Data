    function AuthScreen() {
      const [mode, setMode] = useState('login');

      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setMessage(''); setLoading(true);
        try {
          if (mode === 'login') await signInWithEmailAndPassword(auth, email.trim(), password);
          else if (mode === 'register') {
            const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
            if (fullName.trim()) await updateProfile(cred.user, { displayName: fullName.trim() });
          } else if (mode === 'reset') {
            await sendPasswordResetEmail(auth, email.trim());
            setMessage('Password recovery link sent! Check your email inbox.');
          }
        } catch (err) { setError(err?.message || 'Authentication failed.'); } finally { setLoading(false); }
      };
      const handleGoogleLogin = async () => {
        setError(''); setLoading(true);
        try { await signInWithPopup(auth, googleProvider); } 
        catch (err) { if (err?.code !== 'auth/popup-closed-by-user') setError(err?.message || 'Google Sign-In failed.'); } 
        finally { setLoading(false); }

    function RecordTripView({ user, currencySymbol, editingTrip, onCancelEdit, onSaved, defaultVehicle }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const [title, setTitle] = useState(''); const [date, setDate] = useState(todayStr); const [vehicle, setVehicle] = useState(defaultVehicle || ''); const [client, setClient] = useState(''); const [tripType, setTripType] = useState('City Trip'); const [startLocation, setStartLocation] = useState(''); const [destination, setDestination] = useState(''); const [price, setPrice] = useState(''); const [fuel, setFuel] = useState(''); const [meals, setMeals] = useState(''); const [other, setOther] = useState(''); const [notes, setNotes] = useState(''); const [saving, setSaving] = useState(false);

          setTitle(editingTrip.title || ''); setDate(editingTrip.date || todayStr); setVehicle(editingTrip.vehicle || defaultVehicle || ''); setClient(editingTrip.client || ''); setTripType(editingTrip.tripType || 'City Trip'); setStartLocation(editingTrip.startLocation || ''); setDestination(editingTrip.destination || ''); setPrice(editingTrip.price ?? ''); setFuel(editingTrip.fuel ?? ''); setMeals(editingTrip.meals ?? ''); setOther(editingTrip.other ?? ''); setNotes(editingTrip.notes || '');
        }
      }, [editingTrip, defaultVehicle, todayStr]);

      const numPrice = parseFloat(price) || 0; const totalExpenses = (parseFloat(fuel) || 0) + (parseFloat(meals) || 0) + (parseFloat(other) || 0); const netProfit = numPrice - totalExpenses;

      const handleSave = async (e) => {
        e.preventDefault(); setSaving(true);
        try {

    function DriverDashboardView({ trips, expenses, currencySymbol, userEmail, businessName }) {
      const [selectedYear, setSelectedYear] = useState('All'); const [selectedMonth, setSelectedMonth] = useState('All'); const [selectedType, setSelectedType] = useState('All'); const [reportTab, setReportTab] = useState('all');
      const [startDate, setStartDate] = useState(''); const [endDate, setEndDate] = useState('');
      
      const availableYears = useMemo(() => { const yrs = new Set([String(new Date().getFullYear())]); trips.forEach((t) => { if (t.date && t.date.length >= 4) yrs.add(t.date.slice(0, 4)); }); return ['All', ...Array.from(yrs).sort().reverse()]; }, [trips]);

      const { filteredTrips, filteredExpenses } = useMemo(() => {
        const now = new Date(); const todayStr = now.toISOString().slice(0, 10); const sevenDaysAgo = new Date(now); sevenDaysAgo.setDate(now.getDate() - 7); const currentMonthPrefix = todayStr.slice(0, 7);
        const matchDate = (dateStr) => {
          if (!dateStr) return true;
          if (startDate && endDate) return dateStr >= startDate && dateStr <= endDate;
          if (startDate) return dateStr >= startDate;
          if (selectedYear !== 'All' && !dateStr.startsWith(selectedYear)) return false; 
          if (selectedMonth !== 'All' && dateStr.slice(5, 7) !== String(MONTHS.indexOf(selectedMonth) + 1).padStart(2, '0')) return false;
          if (reportTab === 'daily') return dateStr === todayStr; 
          if (reportTab === 'weekly') return new Date(dateStr) >= sevenDaysAgo; 
          if (reportTab === 'monthly') return dateStr.startsWith(currentMonthPrefix); 
          return true;
        };
        return { filteredTrips: trips.filter((t) => matchDate(t.date) && (selectedType === 'All' || t.tripType === selectedType)), filteredExpenses: expenses.filter((e) => matchDate(e.date)) };
      }, [trips, expenses, selectedYear, selectedMonth, selectedType, reportTab, startDate, endDate]);

      const stats = useMemo(() => {
        const totalIncome = filteredTrips.reduce((s, t) => s + (Number(t.price) || 0), 0);
        const totalExpenses = filteredTrips.reduce((s, t) => s + (Number(t.totalExpenses) || 0), 0) + filteredExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
        const netProfit = totalIncome - totalExpenses;
        return { totalTrips: filteredTrips.length, totalIncome, totalExpenses, netProfit };
      }, [filteredTrips, filteredExpenses]);

      return (
        <div className="flex flex-col xl:flex-row gap-4">
          <div className="flex-1 space-y-4">
            <div className="bg-[#4E1609] rounded-2xl px-5 py-3.5 text-white flex flex-wrap justify-between items-center gap-3 shadow border-b-4 border-[#E5A93C]">
              <div><h2 className="text-lg font-black">Driver Executive Analytics</h2><p className="text-[11px] text-[#FAD8C8]">Real-time cloud business overview</p></div>
              <div className="flex gap-2 no-print"><button type="button" onClick={() => generateDriverPDF({ trips: filteredTrips, expenses: filteredExpenses, currencySymbol, periodLabel: reportTab.toUpperCase(), userEmail, businessName })} className="px-3 py-1.5 rounded-xl bg-[#8B2610] text-white text-xs font-bold flex items-center gap-1.5"><FileText className="w-4 h-4" /> Download PDF Report</button></div>
            </div>
            
            <div className="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border shadow-sm items-center justify-between">
              <div className="flex gap-1 overflow-x-auto">
                {[{ id: 'all', label: 'All-Time' }, { id: 'daily', label: 'Today' }, { id: 'weekly', label: 'Last 7 Days' }, { id: 'monthly', label: 'This Month' }].map((tab) => (
                  <button key={tab.id} type="button" onClick={() => { setReportTab(tab.id); setStartDate(''); setEndDate(''); }} className={`px-3 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${reportTab === tab.id && !startDate ? 'bg-[#4E1609] text-white shadow' : 'bg-[#FFF3ED] text-[#4E1609] hover:bg-[#E8C5B5]/40'}`}>{tab.label}</button>
                ))}
              </div>
              <div className="flex items-center gap-1.5 px-2 py-1 bg-[#FFF9F6] border rounded-xl text-xs">
                <Calendar className="w-3.5 h-3.5 text-[#4E1609]" />
                <span className="font-bold text-[10px] text-[#4E1609]">Date Search:</span>
                <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="px-1.5 py-0.5 rounded border bg-white text-[11px]" />
                <span>to</span>
                <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="px-1.5 py-0.5 rounded border bg-white text-[11px]" />
                {(startDate || endDate) && <button type="button" onClick={() => { setStartDate(''); setEndDate(''); }} className="text-[10px] text-red-600 font-bold underline px-1">Reset</button>}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black">{stats.totalTrips}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Total Trips</div></div>
              <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black text-gray-900">{formatCompact(stats.totalIncome, currencySymbol)}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Gross Income</div></div>
              <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black text-[#8B2610]">{formatCompact(stats.totalExpenses, currencySymbol)}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Total Expenses</div></div>
              <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black text-[#4E8B31]">{formatCompact(stats.netProfit, currencySymbol)}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Net Profit</div></div>
            </div>
          </div>
          <aside className="w-full xl:w-56 bg-[#4E1609] text-white rounded-2xl p-4 shadow border-2 border-[#7A2917] space-y-4 no-print">
            <div className="flex justify-between items-center border-b border-[#7A2917] pb-2"><span className="text-xs font-black text-[#F5B942] flex items-center gap-1"><Filter className="w-3.5 h-3.5" /> Slicers</span><button type="button" onClick={() => { setSelectedYear('All'); setSelectedType('All'); setReportTab('all'); setStartDate(''); setEndDate(''); }} className="text-[10px] text-[#FAD8C8] underline">Reset</button></div>
            <div><div className="text-[11px] font-bold text-[#FAD8C8] mb-1">Year</div><div className="grid grid-cols-2 gap-1">{availableYears.map((yr) => <button key={yr} type="button" onClick={() => setSelectedYear(yr)} className={`py-1 rounded text-xs font-bold ${selectedYear === yr ? 'bg-[#FAD8C8] text-[#4E1609]' : 'bg-[#6B1D0E] text-white'}`}>{yr}</button>)}</div></div>
            <div><div className="text-[11px] font-bold text-[#FAD8C8] mb-1">Trip Type</div><div className="space-y-1">{['All', ...TRIP_TYPES].map((t) => <button key={t} type="button" onClick={() => setSelectedType(t)} className={`w-full text-left py-1 px-2 rounded text-xs font-bold truncate ${selectedType === t ? 'bg-[#FAD8C8] text-[#4E1609]' : 'bg-[#6B1D0E] text-white'}`}>{t}</button>)}</div></div>
          </aside>
        </div>
      );
    }

    function DriverHistoryView({ trips, expenses, currencySymbol, user, userEmail, businessName, onEditTrip }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const filtered = trips.filter((t) => {
        const matchesSearch = !searchQuery || (t.title + t.client + t.vehicle).toLowerCase().includes(searchQuery.toLowerCase());
        const matchesDate = (!startDate || t.date >= startDate) && (!endDate || t.date <= endDate);
        return matchesSearch && matchesDate;
      });

      return (
        <div className="space-y-4">
          <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl flex justify-between items-center border-b-4 border-[#E5A93C]">
            <div><h2 className="text-lg font-black">Driver Trip History</h2><p className="text-xs text-[#FAD8C8]">{filtered.length} records found</p></div>
            <button type="button" onClick={() => generateDriverPDF({ trips: filtered, expenses, currencySymbol, periodLabel: 'HISTORY', userEmail, businessName })} className="px-4 py-2 rounded-xl bg-[#8B2610] text-white text-xs font-bold flex items-center gap-2"><FileText className="w-4 h-4" /> Export PDF</button>

          <div className="bg-white p-4 rounded-2xl border flex flex-wrap gap-3 items-center justify-between">

            <div className="flex items-center gap-2 text-xs">
              <Calendar className="w-4 h-4 text-[#4E1609]" />
              <span className="font-bold text-[#4E1609]">From:</span><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="px-2 py-1.5 rounded-xl border bg-[#FFF9F6]" />
              <span className="font-bold text-[#4E1609]">To:</span><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="px-2 py-1.5 rounded-xl border bg-[#FFF9F6]" />

                <div>
                  <div className="flex gap-2"><span className="text-[11px] font-bold bg-[#4E1609] text-[#F5B942] px-2 py-0.5 rounded">{trip.tripType}</span><span className="text-xs text-gray-500">{trip.date}</span></div>
                  <h3 className="text-base font-black mt-1">{trip.title}</h3><p className="text-xs text-gray-600">Client: {trip.client || 'N/A'} • Vehicle: {trip.vehicle || 'N/A'}</p>

                  <div className="text-right"><div className="text-[10px] text-gray-400 font-bold">PROFIT</div><div className="text-sm font-black text-[#4E8B31]">{formatMoney(trip.netProfit, currencySymbol)}</div></div>

                  <button type="button" onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'trips', trip.id))} className="p-2 rounded bg-red-50 text-red-600"><Trash2 className="w-4 h-4" /></button>

              </div>

        </div>

    function RecordProviderTxView({ user, currencySymbol, editingTx, onCancelEdit, onSaved }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const [title, setTitle] = useState(''); const [date, setDate] = useState(todayStr); const [client, setClient] = useState(''); const [providerName, setProviderName] = useState(''); const [tripType, setTripType] = useState('City Trip'); const [vehicle, setVehicle] = useState(''); const [startLocation, setStartLocation] = useState(''); const [destination, setDestination] = useState(''); const [saleRate, setSaleRate] = useState(''); const [purchaseRate, setPurchaseRate] = useState(''); const [notes, setNotes] = useState(''); const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (editingTx) {
          setTitle(editingTx.title || ''); setDate(editingTx.date || todayStr); setClient(editingTx.client || ''); setProviderName(editingTx.providerName || ''); setTripType(editingTx.tripType || 'City Trip'); setVehicle(editingTx.vehicle || ''); setStartLocation(editingTx.startLocation || ''); setDestination(editingTx.destination || ''); setSaleRate(String(editingTx.saleRate || '')); setPurchaseRate(String(editingTx.purchaseRate || '')); setNotes(editingTx.notes || '');
        }
      }, [editingTx, todayStr]);

      const handleSave = async (e) => {
        e.preventDefault(); setSaving(true);
        try {
          const payload = { title: title.trim() || `${tripType} - ${destination || 'Transaction'}`, date, client: client.trim() || 'General Organization', providerName: providerName.trim() || 'Direct Provider', tripType, vehicle: vehicle.trim() || 'N/A', startLocation: startLocation.trim(), destination: destination.trim(), saleRate: parseFloat(saleRate) || 0, purchaseRate: parseFloat(purchaseRate) || 0, notes: notes.trim(), updatedAt: serverTimestamp() };
          const txRef = collection(db, 'artifacts', APP_ID, 'users', user.uid, 'providerTransactions');
          if (editingTx?.id) await updateDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'providerTransactions', editingTx.id), payload);
          else await addDoc(txRef, { ...payload, createdAt: serverTimestamp() });
          if (!editingTx) { setTitle(''); setClient(''); setProviderName(''); setVehicle(''); setStartLocation(''); setDestination(''); setSaleRate(''); setPurchaseRate(''); setNotes(''); }
          onSaved(editingTx ? 'Transaction updated!' : 'Transaction recorded!');
        } catch (err) { alert('Error: ' + err.message); } finally { setSaving(false); }
      };

      return (
        <div className="max-w-4xl mx-auto">
          <div className="bg-[#4E1609] text-white px-6 py-4 rounded-2xl mb-5 flex justify-between items-center shadow border-b-4 border-[#E5A93C]">
            <div><h2 className="text-lg font-extrabold">{editingTx ? 'Edit Provider Transaction' : 'Record Provider Transaction'}</h2><p className="text-xs text-[#FAD8C8]">Manage B2B Sale and Purchase Rates</p></div>
            {editingTx && <button type="button" onClick={onCancelEdit} className="px-3 py-1.5 rounded bg-white/20 text-xs font-bold">Cancel</button>}
          </div>
          <form onSubmit={handleSave} className="bg-white rounded-2xl p-6 shadow-md border border-[#E2B8A6] space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4"><div className="md:col-span-2"><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Transaction Title *</label><input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Monthly Staff Transport" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Date *</label><input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div></div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Organization / Client *</label><input type="text" required value={client} onChange={(e) => setClient(e.target.value)} placeholder="Organization Name" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Transport Provider</label><input type="text" value={providerName} onChange={(e) => setProviderName(e.target.value)} placeholder="Provider Name" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Trip Type *</label><select value={tripType} onChange={(e) => setTripType(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]">{TRIP_TYPES.map(t => <option key={t} value={t}>{t}</option>)}</select></div></div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Vehicle</label><input type="text" value={vehicle} onChange={(e) => setVehicle(e.target.value)} placeholder="Vehicle info" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div><div><label className="block text-xs font-bold text-emerald-800 uppercase mb-1">Sale Rate * ({currencySymbol})</label><input type="number" step="any" min="0" required value={saleRate} onChange={(e) => setSaleRate(e.target.value)} placeholder="0" className="w-full px-3.5 py-2.5 rounded-xl border border-emerald-300 bg-white font-bold" /></div><div><label className="block text-xs font-bold text-[#8B2610] uppercase mb-1">Purchase Rate * ({currencySymbol})</label><input type="number" step="any" min="0" required value={purchaseRate} onChange={(e) => setPurchaseRate(e.target.value)} placeholder="0" className="w-full px-3.5 py-2.5 rounded-xl border border-red-300 bg-white font-bold" /></div></div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Starting Location</label><input type="text" value={startLocation} onChange={(e) => setStartLocation(e.target.value)} placeholder="From" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div><div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Destination</label><input type="text" value={destination} onChange={(e) => setDestination(e.target.value)} placeholder="To" className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]" /></div></div>
            <div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Additional Notes</label><textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows="2" placeholder="Notes..." className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8B4A4] bg-[#FFF9F6]"></textarea></div>
            <button type="submit" disabled={saving} className="w-full py-3.5 rounded-xl bg-[#4E1609] hover:bg-[#6B1D0E] text-white font-extrabold text-sm shadow transition">{saving ? 'Saving...' : editingTx ? 'Update Transaction' : 'Save Transaction'}</button>
          </form>
        </div>
      );
    }

    function ProviderDashboardView({ providerTransactions, currencySymbol, userEmail, businessName }) {
      const [reportTab, setReportTab] = useState('all');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      
      const filtered = useMemo(() => {
        const now = new Date(); const todayStr = now.toISOString().slice(0, 10); const sevenDaysAgo = new Date(now); sevenDaysAgo.setDate(now.getDate() - 7); const currentMonthPrefix = todayStr.slice(0, 7);
        return providerTransactions.filter((t) => {
          if (startDate && endDate) return t.date >= startDate && t.date <= endDate;
          if (startDate) return t.date >= startDate;
          if (reportTab === 'daily') return t.date === todayStr; 
          if (reportTab === 'weekly') return new Date(t.date) >= sevenDaysAgo; 
          if (reportTab === 'monthly') return t.date.startsWith(currentMonthPrefix); 
          return true;
        });
      }, [providerTransactions, reportTab, startDate, endDate]);

      const stats = useMemo(() => {
        return {
          totalSales: filtered.reduce((s, t) => s + (Number(t.saleRate) || 0), 0),
          totalPurchases: filtered.reduce((s, t) => s + (Number(t.purchaseRate) || 0), 0),
          totalOrgs: new Set(filtered.map(t => t.client)).size,
          totalTransactions: filtered.length
        };
      }, [filtered]);

      return (
        <div className="space-y-4">
          <div className="bg-[#4E1609] text-white px-5 py-3.5 rounded-2xl flex flex-wrap justify-between items-center gap-3 shadow border-b-4 border-[#E5A93C]">
            <div><h2 className="text-lg font-black">Provider Executive Analytics</h2><p className="text-[11px] text-[#FAD8C8]">B2B Organization Sale & Purchase Rates</p></div>
            <button type="button" onClick={() => generateProviderPDF({ transactions: filtered, currencySymbol, periodLabel: reportTab.toUpperCase(), userEmail, businessName })} className="px-3 py-1.5 rounded-xl bg-[#8B2610] text-white text-xs font-bold flex items-center gap-1.5"><FileText className="w-4 h-4" /> Download PDF Report</button>
          </div>
          
          <div className="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border shadow-sm items-center justify-between">
            <div className="flex gap-1 overflow-x-auto">
              {[{ id: 'all', label: 'All-Time' }, { id: 'daily', label: 'Today' }, { id: 'weekly', label: 'Last 7 Days' }, { id: 'monthly', label: 'This Month' }].map((tab) => (
                <button key={tab.id} type="button" onClick={() => { setReportTab(tab.id); setStartDate(''); setEndDate(''); }} className={`px-3 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${reportTab === tab.id && !startDate ? 'bg-[#4E1609] text-white shadow' : 'bg-[#FFF3ED] text-[#4E1609] hover:bg-[#E8C5B5]/40'}`}>{tab.label}</button>
              ))}
            </div>
            <div className="flex items-center gap-1.5 px-2 py-1 bg-[#FFF9F6] border rounded-xl text-xs">
              <Calendar className="w-3.5 h-3.5 text-[#4E1609]" />
              <span className="font-bold text-[10px] text-[#4E1609]">Date Search:</span>
              <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="px-1.5 py-0.5 rounded border bg-white text-[11px]" />
              <span>to</span>
              <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="px-1.5 py-0.5 rounded border bg-white text-[11px]" />
              {(startDate || endDate) && <button type="button" onClick={() => { setStartDate(''); setEndDate(''); }} className="text-[10px] text-red-600 font-bold underline px-1">Reset</button>}
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black">{stats.totalTransactions}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Transactions</div></div>
            <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black text-emerald-800">{formatCompact(stats.totalSales, currencySymbol)}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Total Sales</div></div>
            <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black text-[#8B2610]">{formatCompact(stats.totalPurchases, currencySymbol)}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Total Purchases</div></div>
            <div className="bg-white rounded-2xl p-4 text-center border shadow-sm"><div className="text-2xl font-black">{stats.totalOrgs}</div><div className="text-xs font-bold text-[#4E1609] mt-1">Organizations</div></div>
          </div>
        </div>
      );
    }

    function ProviderHistoryView({ providerTransactions, currencySymbol, user, userEmail, businessName, onEditTx }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const filtered = providerTransactions.filter((tx) => {
        const matchesSearch = !searchQuery || (tx.title + tx.client + tx.providerName + tx.vehicle).toLowerCase().includes(searchQuery.toLowerCase());
        const matchesDate = (!startDate || tx.date >= startDate) && (!endDate || tx.date <= endDate);
        return matchesSearch && matchesDate;
      });

      return (
        <div className="space-y-4">
          <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl flex justify-between items-center border-b-4 border-[#E5A93C]">
            <div><h2 className="text-lg font-black">Provider Transactions History</h2><p className="text-xs text-[#FAD8C8]">{filtered.length} records found</p></div>
            <button type="button" onClick={() => generateProviderPDF({ transactions: filtered, currencySymbol, periodLabel: 'HISTORY', userEmail, businessName })} className="px-4 py-2 rounded-xl bg-[#8B2610] text-white text-xs font-bold flex items-center gap-2"><FileText className="w-4 h-4" /> Export PDF</button>
          </div>
          
          <div className="bg-white p-4 rounded-2xl border flex flex-wrap gap-3 items-center justify-between">
            <div className="flex-1 min-w-[200px]"><input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search provider transactions..." className="w-full px-3 py-2 rounded-xl border bg-[#FFF9F6] text-xs" /></div>
            <div className="flex items-center gap-2 text-xs">
              <Calendar className="w-4 h-4 text-[#4E1609]" />
              <span className="font-bold text-[#4E1609]">From:</span><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="px-2 py-1.5 rounded-xl border bg-[#FFF9F6]" />
              <span className="font-bold text-[#4E1609]">To:</span><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="px-2 py-1.5 rounded-xl border bg-[#FFF9F6]" />
              {(startDate || endDate) && <button type="button" onClick={() => { setStartDate(''); setEndDate(''); }} className="text-xs text-red-600 font-bold underline">Clear</button>}
            </div>
          </div>

          <div className="space-y-3">
            {filtered.map((tx) => (
              <div key={tx.id} className="bg-white rounded-2xl p-4 border flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <div>
                  <div className="flex gap-2"><span className="text-[11px] font-bold bg-[#4E1609] text-[#F5B942] px-2 py-0.5 rounded">{tx.tripType}</span><span className="text-xs text-gray-500">{tx.date}</span></div>
                  <h3 className="text-base font-black mt-1">{tx.title}</h3><p className="text-xs text-gray-600">Org: <b>{tx.client}</b> • Provider: {tx.providerName || 'N/A'}</p>
                </div>
                <div className="flex items-center gap-4">
                  <div className="text-right"><div className="text-xs font-bold text-emerald-800">Sale: {formatMoney(tx.saleRate, currencySymbol)}</div><div className="text-xs font-bold text-[#8B2610]">Purchase: {formatMoney(tx.purchaseRate, currencySymbol)}</div></div>
                  <button type="button" onClick={() => onEditTx(tx)} className="p-2 rounded bg-amber-50 text-[#4E1609]"><Edit3 className="w-4 h-4" /></button>
                  <button type="button" onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'providerTransactions', tx.id))} className="p-2 rounded bg-red-50 text-red-600"><Trash2 className="w-4 h-4" /></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function OrganizationHistoryView({ trips, providerTransactions, currencySymbol }) {
      const [searchTerm, setSearchTerm] = useState(''); const [selectedOrg, setSelectedOrg] = useState(null);
      const organizations = useMemo(() => {
        const orgMap = {};
        trips.forEach(t => { const orgName = (t.client || 'General Client').trim(); if (!orgMap[orgName]) orgMap[orgName] = { name: orgName, driverTrips: [], providerTxs: [] }; orgMap[orgName].driverTrips.push(t); });
        providerTransactions.forEach(p => { const orgName = (p.client || 'General Organization').trim(); if (!orgMap[orgName]) orgMap[orgName] = { name: orgName, driverTrips: [], providerTxs: [] }; orgMap[orgName].providerTxs.push(p); });
        return Object.values(orgMap).sort((a,b) => a.name.localeCompare(b.name));
      }, [trips, providerTransactions]);
      const filteredOrgs = useMemo(() => { if (!searchTerm) return organizations; return organizations.filter(o => o.name.toLowerCase().includes(searchTerm.toLowerCase())); }, [organizations, searchTerm]);

      return (
        <div className="space-y-5 max-w-6xl mx-auto">
          <div className="bg-[#4E1609] text-white px-6 py-4 rounded-2xl flex justify-between items-center shadow border-b-4 border-[#E5A93C]"><div><h2 className="text-lg font-black flex items-center gap-2"><Building2 className="w-5 h-5 text-[#F5B942]" /> Client & Organization History</h2><p className="text-xs text-[#FAD8C8]">Unified multi-date service history</p></div></div>
          {!selectedOrg ? (
            <div className="space-y-4">
              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center gap-3"><Search className="w-5 h-5 text-gray-400" /><input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Search organizations..." className="w-full px-3 py-2 rounded-xl border bg-[#FFF9F6] text-sm focus:outline-none" /></div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredOrgs.map((org) => (
                  <div key={org.name} onClick={() => setSelectedOrg(org)} className="bg-white rounded-2xl p-5 border shadow-sm hover:border-[#4E1609] transition cursor-pointer flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-2"><span className="text-[10px] font-bold bg-[#4E1609] text-[#F5B942] px-2 py-0.5 rounded">ORG PROFILE</span><span className="text-xs font-black text-gray-700">{org.driverTrips.length + org.providerTxs.length} Records</span></div>
                      <h3 className="text-base font-black text-[#4E1609]">{org.name}</h3><p className="text-xs text-gray-500 mt-1">Driver: {org.driverTrips.length} | Provider: {org.providerTxs.length}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="space-y-5 bg-white p-6 rounded-2xl border shadow-sm">
              <div className="flex justify-between items-center border-b pb-4"><div><span className="text-xs font-bold text-[#8B2610] uppercase">Organization Profile</span><h3 className="text-2xl font-black text-[#4E1609] mt-0.5">{selectedOrg.name}</h3></div><button type="button" onClick={() => setSelectedOrg(null)} className="px-4 py-2 rounded-xl bg-[#4E1609] text-white text-xs font-bold">Back</button></div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-3"><h4 className="text-sm font-black text-[#4E1609] uppercase flex items-center gap-1.5"><Truck className="w-4 h-4 text-[#E5A93C]" /> Driver Trips ({selectedOrg.driverTrips.length})</h4>
                  <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2">{selectedOrg.driverTrips.map(t => (<div key={t.id} className="p-3.5 rounded-xl bg-[#FFF9F6] border border-[#E8C5B5] space-y-1"><div className="flex justify-between text-xs font-bold"><span className="text-[#4E1609]">{t.title}</span><span className="text-gray-500">{t.date}</span></div><div className="text-xs text-gray-600">Vehicle: {t.vehicle}</div><div className="flex justify-between text-xs font-black pt-1 border-t"><span className="text-emerald-800">Income: {formatMoney(t.price, currencySymbol)}</span><span className="text-[#4E8B31]">Profit: {formatMoney(t.netProfit, currencySymbol)}</span></div></div>))}</div>
                </div>
                <div className="space-y-3"><h4 className="text-sm font-black text-[#4E1609] uppercase flex items-center gap-1.5"><Briefcase className="w-4 h-4 text-[#E5A93C]" /> Provider Txs ({selectedOrg.providerTxs.length})</h4>
                  <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2">{selectedOrg.providerTxs.map(p => (<div key={p.id} className="p-3.5 rounded-xl bg-[#FFF9F6] border border-[#E8C5B5] space-y-1"><div className="flex justify-between text-xs font-bold"><span className="text-[#4E1609]">{p.title}</span><span className="text-gray-500">{p.date}</span></div><div className="text-xs text-gray-600">Provider: {p.providerName || 'N/A'}</div><div className="flex justify-between text-xs font-black pt-1 border-t"><span className="text-emerald-800">Sale: {formatMoney(p.saleRate, currencySymbol)}</span><span className="text-[#8B2610]">Purchase: {formatMoney(p.purchaseRate, currencySymbol)}</span></div></div>))}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsView({ user, preferences, onSavePreferences }) {
      const [curr, setCurr] = useState(preferences.currencyCode || 'PKR'); const [veh, setVeh] = useState(preferences.defaultVehicle || ''); const [biz, setBiz] = useState(preferences.businessName || '');
      return (
        <div className="max-w-3xl mx-auto space-y-5">
          <div className="bg-[#4E1609] text-white px-5 py-4 rounded-2xl border-b-4 border-[#E5A93C]"><h2 className="text-lg font-black">Settings</h2></div>
          <form onSubmit={(e) => { e.preventDefault(); onSavePreferences({ currencyCode: curr, currencySymbol: CURRENCIES.find(c => c.code === curr)?.symbol || 'Rs.', defaultVehicle: veh, businessName: biz }); alert('Saved!'); }} className="bg-white p-6 rounded-2xl border space-y-4">
            <div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Currency</label><select value={curr} onChange={(e) => setCurr(e.target.value)} className="w-full px-4 py-3 rounded-xl border bg-[#FFF9F6]">{CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}</select></div>
            <div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Default Vehicle</label><input type="text" value={veh} onChange={(e) => setVeh(e.target.value)} className="w-full px-4 py-3 rounded-xl border bg-[#FFF9F6]" /></div>
            <div><label className="block text-xs font-bold text-[#4E1609] uppercase mb-1">Company / Fleet Name</label><input type="text" value={biz} onChange={(e) => setBiz(e.target.value)} className="w-full px-4 py-3 rounded-xl border bg-[#FFF9F6]" /></div>
            <button type="submit" className="px-6 py-3 rounded-xl bg-[#4E1609] text-white font-bold">Save Preferences</button>
          </form>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [appMode, setAppMode] = useState('driver'); // 'driver' or 'provider'
      const [activeDriverTab, setActiveDriverTab] = useState('record'); // Set Record as default first tab
      const [activeProviderTab, setActiveProviderTab] = useState('record'); // Set Record as default first tab
      
      const [trips, setTrips] = useState([]);
      const [providerTransactions, setProviderTransactions] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [editingTrip, setEditingTrip] = useState(null);
      const [editingTx, setEditingTx] = useState(null);
      const [toast, setToast] = useState('');
      const [preferences, setPreferences] = useState({ currencyCode: 'PKR', currencySymbol: 'Rs.', defaultVehicle: '', businessName: '' });

      useEffect(() => { return onAuthStateChanged(auth, (u) => { setUser(u); setAuthReady(true); }); }, []);

      useEffect(() => {
        if (!user) return;
        const unsubTrips = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'trips'), (s) => setTrips(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
        const unsubProv = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'providerTransactions'), (s) => setProviderTransactions(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
        const unsubExp = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'expenses'), (s) => setExpenses(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
        const unsubPref = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'preferences'), (s) => { if (s.exists()) setPreferences(prev => ({ ...prev, ...s.data() })); });
        return () => { unsubTrips(); unsubProv(); unsubExp(); unsubPref(); };
      }, [user]);

      if (!authReady) return <div className="min-h-screen flex items-center justify-center bg-[#FAD8C8]"><CarLogo3D size="lg" /></div>;
      if (!user) return <AuthScreen />;

      // Navigation order: "Record" is first, followed by Dashboard, History, Org History, and Settings
      const driverNav = [
        { id: 'record', label: 'Record Trip', icon: PlusCircle },
        { id: 'dashboard', label: 'Driver Dashboard', icon: LayoutDashboard },
        { id: 'history', label: 'Trip History', icon: History },
        { id: 'org-history', label: 'Org History', icon: Building2 },
        { id: 'settings', label: 'Settings', icon: Settings }
      ];

      const providerNav = [
        { id: 'record', label: 'Record Transaction', icon: PlusCircle },
        { id: 'dashboard', label: 'Provider Dashboard', icon: Briefcase },
        { id: 'history', label: 'Tx History', icon: History },
        { id: 'org-history', label: 'Org History', icon: Building2 },
        { id: 'settings', label: 'Settings', icon: Settings }
      ];

      const currentNav = appMode === 'driver' ? driverNav : providerNav;
      const activeTab = appMode === 'driver' ? activeDriverTab : activeProviderTab;
      
      const handleTabSwitch = (id) => {
        if (appMode === 'driver') setActiveDriverTab(id); else setActiveProviderTab(id);
        setEditingTrip(null); setEditingTx(null);
      };

      const toggleAppMode = () => {
        setAppMode(prev => prev === 'driver' ? 'provider' : 'driver');
        setEditingTrip(null); setEditingTx(null);
      };

      return (
        <div className="min-h-screen pb-24 md:pb-8 bg-[#FAD8C8]">
          <header className="bg-[#4E1609] text-white sticky top-0 z-30 shadow border-b-2 border-[#E5A93C] no-print">
            <div className="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <CarLogo3D size="sm" />
                <div><span className="text-base font-black text-[#FFF6E5]">{preferences.businessName || 'DRIVE DATA'}</span><span className="text-[10px] text-[#F5B942] block">{user.email}</span></div>
              </div>
              <div className="flex items-center gap-3">
                <button type="button" onClick={toggleAppMode} className={`px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 shadow-md transition ${appMode === 'driver' ? 'bg-[#5E8C31] text-white' : 'bg-[#E5A93C] text-[#4E1609]'}`}>
                  <ArrowRightLeft className="w-4 h-4" /> 
                  Switch to {appMode === 'driver' ? 'Provider' : 'Driver'} Mode
                </button>
                <button type="button" onClick={() => signOut(auth)} className="px-3 py-2 rounded-xl bg-[#6B1D0E] text-[#FAD8C8] text-xs font-bold hidden sm:flex items-center gap-1"><LogOut className="w-4 h-4" />Logout</button>
              </div>
            </div>
            
            <div className="bg-[#3A0E05] px-4 py-2 overflow-x-auto">
              <div className="max-w-7xl mx-auto flex gap-2">
                {currentNav.map(item => { 
                  const Icon = item.icon; 
                  const isActive = activeTab === item.id;
                  return (
                    <button key={item.id} type="button" onClick={() => handleTabSwitch(item.id)} className={`px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 whitespace-nowrap transition ${isActive ? 'bg-[#FAD8C8] text-[#4E1609]' : 'text-[#FAD8C8] hover:bg-[#6B1D0E]'}`}>
                      <Icon className="w-4 h-4" />{item.label}
                    </button>
                  ); 
                })}
              </div>
            </div>
          </header>

          {toast && <div className="fixed top-24 right-4 z-50 bg-[#4E8B31] text-white px-4 py-2.5 rounded-xl shadow text-xs font-bold flex items-center gap-2"><CheckCircle2 className="w-4 h-4" /> {toast}</div>}

          <main className="max-w-7xl mx-auto px-3 sm:px-5 pt-5">
            {appMode === 'driver' && activeDriverTab === 'record' && <RecordTripView user={user} currencySymbol={preferences.currencySymbol} defaultVehicle={preferences.defaultVehicle} editingTrip={editingTrip} onCancelEdit={() => setEditingTrip(null)} onSaved={(msg) => { setEditingTrip(null); setToast(msg); setTimeout(() => setToast(''), 3000); setActiveDriverTab('history'); }} />}
            {appMode === 'driver' && activeDriverTab === 'dashboard' && <DriverDashboardView trips={trips} expenses={expenses} currencySymbol={preferences.currencySymbol} userEmail={user.email} businessName={preferences.businessName} />}
            {appMode === 'driver' && activeDriverTab === 'history' && <DriverHistoryView trips={trips} expenses={expenses} currencySymbol={preferences.currencySymbol} user={user} userEmail={user.email} businessName={preferences.businessName} onEditTrip={(t) => { setEditingTrip(t); setActiveDriverTab('record'); }} />}
            
            {appMode === 'provider' && activeProviderTab === 'record' && <RecordProviderTxView user={user} currencySymbol={preferences.currencySymbol} editingTx={editingTx} onCancelEdit={() => setEditingTx(null)} onSaved={(msg) => { setEditingTx(null); setToast(msg); setTimeout(() => setToast(''), 3000); setActiveProviderTab('history'); }} />}
            {appMode === 'provider' && activeProviderTab === 'dashboard' && <ProviderDashboardView providerTransactions={providerTransactions} currencySymbol={preferences.currencySymbol} userEmail={user.email} businessName={preferences.businessName} />}
            {appMode === 'provider' && activeProviderTab === 'history' && <ProviderHistoryView providerTransactions={providerTransactions} currencySymbol={preferences.currencySymbol} user={user} userEmail={user.email} businessName={preferences.businessName} onEditTx={(tx) => { setEditingTx(tx); setActiveProviderTab('record'); }} />}

            {activeTab === 'org-history' && <OrganizationHistoryView trips={trips} providerTransactions={providerTransactions} currencySymbol={preferences.currencySymbol} />}
            {activeTab === 'settings' && <SettingsView user={user} preferences={preferences} onSavePreferences={async (p) => { setPreferences(prev => ({...prev, ...p})); await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'preferences'), p, { merge: true }); }} />}
          </main>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
